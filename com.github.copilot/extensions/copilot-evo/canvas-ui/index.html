<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot Evo · EXP</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-badge" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <defs>
                <linearGradient id="helixBack" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#54aeff"/>
                  <stop offset="100%" stop-color="#0969da"/>
                </linearGradient>
                <linearGradient id="helixFront" x1="20" y1="4" x2="4" y2="20" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#0550ae"/>
                  <stop offset="100%" stop-color="#218bff"/>
                </linearGradient>
              </defs>
              <g transform="rotate(35 12 12)">
                <path d="M8.5 3.5C8.5 8.5 15.5 9.5 15.5 12C15.5 14.5 8.5 15.5 8.5 20.5" stroke="url(#helixBack)" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M15.5 3.5C15.5 8.5 8.5 9.5 8.5 12C8.5 14.5 15.5 15.5 15.5 20.5" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round"/>
                <path d="M15.5 3.5C15.5 8.5 8.5 9.5 8.5 12C8.5 14.5 15.5 15.5 15.5 20.5" stroke="url(#helixFront)" stroke-width="2.5" stroke-linecap="round"/>
              </g>
            </svg>
          </div>
          <div class="brand-meta">
            <h1>Copilot Evo</h1>
            <p id="telemetry-line" class="telemetry" title="Loading store...">Loading...</p>
          </div>
        </div>
        <div class="actions">
          <button id="btn-pull" class="btn btn-quiet btn-icon" type="button" title="Pull latest shared experiences and refresh">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Refresh</span>
          </button>
        </div>
      </header>

      <div id="banner" class="banner hidden"></div>
      <div id="loading-overlay" class="loading-overlay hidden" role="status" aria-live="polite" aria-busy="true">
        <div class="loading-card">
          <span class="loading-spinner" aria-hidden="true"></span>
          <span id="loading-text" class="loading-text">Working...</span>
        </div>
      </div>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="assets" type="button">Experiences <span id="count-assets" class="pill">0</span></button>
        <button class="tab" data-tab="contributors" type="button">Leaderboard <span id="count-contributors" class="pill">0</span></button>
        <button class="tab" data-tab="relationships" type="button">Relationships <span id="count-links" class="pill">0</span></button>
        <button class="tab" data-tab="events" type="button">Events <span id="count-events" class="pill">0</span></button>
      </nav>

      <section id="assets-toolbar" class="toolbar">
        <div class="search-row">
          <input id="search-input" class="search" type="search" placeholder="Search experiences by title, summary, or signal..." />
          <div class="kind-switch" role="group" aria-label="Experience kind">
            <button class="seg active" data-kind="all" type="button">All</button>
            <button class="seg" data-kind="Rule" type="button">Rules</button>
            <button class="seg" data-kind="Fix" type="button">Fixes</button>
          </div>
        </div>
        <div class="filters">
          <button class="chip active" data-filter="all" type="button" id="chip-all">All</button>
          <button class="chip" data-filter="local" type="button" id="chip-local">Local</button>
          <button class="chip" data-filter="team" type="button" id="chip-team">Team</button>
          <button class="chip" data-filter="starter" type="button" id="chip-starter">Starter</button>
          <button class="chip" data-repo-filter="matching" type="button" id="chip-repo">This Repo</button>
        </div>
      </section>

      <section id="contributors-toolbar" class="toolbar hidden">
        <div class="contrib-bar">
          <div class="kind-switch" role="group" aria-label="Group contributors by">
            <button class="seg active" data-contrib-mode="author" type="button">By Author</button>
            <button class="seg" data-contrib-mode="source" type="button">By Source</button>
          </div>
          <span class="muted">Ranked by avg quality score (not quantity)</span>
        </div>
        <div class="filters">
          <button class="chip active" data-contrib-scope="all" type="button">All Contributed</button>
          <button class="chip" data-contrib-scope="team" type="button">Team Shared</button>
          <button class="chip" data-contrib-scope="local" type="button">Local</button>
        </div>
      </section>

      <section id="events-toolbar" class="toolbar hidden">
        <div class="filters">
          <button class="chip active" data-event-filter="all" type="button">All Events</button>
          <button class="chip" data-event-filter="evolution" type="button">Solidify, Sync & Outcomes</button>
          <button class="chip" data-event-filter="signals" type="button">Captured Failure Signals</button>
        </div>
      </section>

      <section id="rel-toolbar" class="toolbar hidden">
        <div class="filters">
          <button class="chip active" data-rel-mode="all" type="button">Lineage + Shared Signals</button>
          <button class="chip" data-rel-mode="lineage" type="button">Explicit Lineage Only</button>
        </div>
      </section>

      <main id="content" class="content">
        <div id="list-pane" class="list-pane"></div>
        <div id="pane-splitter" class="pane-splitter" role="separator" aria-orientation="horizontal" title="Drag to resize">
          <span class="splitter-grip" aria-hidden="true"></span>
        </div>
        <aside id="detail-pane" class="detail-pane">
          <div class="empty">Select an Experience to inspect its signals, steps, and validation evidence.</div>
        </aside>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
