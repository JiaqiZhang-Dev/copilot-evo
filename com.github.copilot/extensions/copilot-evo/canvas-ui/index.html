<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot Evo · GEP</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="shell">
      <div class="top-accent" aria-hidden="true"></div>
      <header class="topbar">
        <div class="brand">
          <div class="brand-badge" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M7 4c0 4 10 4 10 8s-10 4-10 8" stroke="#1a7f37" stroke-width="2.1" stroke-linecap="round"/>
              <path d="M17 4c0 4-10 4-10 8s10 4 10 8" stroke="#0969da" stroke-width="2.1" stroke-linecap="round"/>
              <line x1="8.5" y1="7" x2="15.5" y2="7" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
              <line x1="8.5" y1="17" x2="15.5" y2="17" stroke="#1a7f37" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
            </svg>
          </div>
          <div class="brand-meta">
            <div class="brand-row">
              <h1>Copilot Evo</h1>
              <span class="proto-pill">EXP</span>
              <span id="live-dot" class="live-dot" title="Live sync connected"></span>
            </div>
            <p id="repo-status" class="muted">Loading store...</p>
          </div>
        </div>
        <div class="actions">
          <button id="btn-pull" class="btn" type="button">Pull</button>
          <button id="btn-push" class="btn btn-primary" type="button">Push Team</button>
        </div>
      </header>

      <section class="kpi-strip" aria-label="Experience summary">
        <div class="kpi-card kpi-exp">
          <span class="kpi-label">Experiences</span>
          <strong id="kpi-total" class="kpi-value">0</strong>
          <span id="kpi-breakdown" class="kpi-sub">0 Rules · 0 Fixes</span>
        </div>
        <div class="kpi-card kpi-team">
          <span class="kpi-label">Team Shared</span>
          <strong id="kpi-team" class="kpi-value">0</strong>
          <span id="kpi-sub-team" class="kpi-sub">Sanitized for sync</span>
        </div>
        <div class="kpi-card kpi-hits">
          <span class="kpi-label">Reused Hits</span>
          <strong id="kpi-reuses" class="kpi-value">0</strong>
          <span class="kpi-sub">Total activations</span>
        </div>
        <div class="kpi-card kpi-events">
          <span class="kpi-label">Events</span>
          <strong id="kpi-events" class="kpi-value">0</strong>
          <span class="kpi-sub">Local only</span>
        </div>
      </section>

      <div id="banner" class="banner hidden"></div>

      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="assets" type="button">Experiences <span id="count-assets" class="pill">0</span></button>
        <button class="tab" data-tab="arena" type="button">Leaderboard <span id="count-arena" class="pill">0</span></button>
        <button class="tab" data-tab="relationships" type="button">Relationships <span id="count-links" class="pill">0</span></button>
        <button class="tab" data-tab="events" type="button">Events <span id="count-events" class="pill">0</span></button>
      </nav>

      <section id="assets-toolbar" class="toolbar">
        <div class="search-row">
          <input id="search-input" class="search" type="search" placeholder="Search experiences by title, summary, or signal..." />
          <div class="kind-switch" role="group" aria-label="Experience kind">
            <button class="seg active" data-kind="all" type="button">All</button>
            <button class="seg" data-kind="Gene" type="button">Rules</button>
            <button class="seg" data-kind="Capsule" type="button">Fixes</button>
          </div>
        </div>
        <div class="filters">
          <button class="chip active" data-filter="all" type="button">All Scopes</button>
          <button class="chip" data-filter="team" type="button">Team</button>
          <button class="chip" data-filter="local" type="button">Local</button>
          <button class="chip" data-filter="starter" type="button">Starter</button>
          <button class="chip" data-repo-filter="matching" type="button" id="chip-repo">This Repo</button>
        </div>
      </section>

      <section id="events-toolbar" class="toolbar hidden">
        <div class="filters">
          <button class="chip active" data-event-filter="all" type="button">All Events</button>
          <button class="chip" data-event-filter="evolution" type="button">Solidify, Sync & Outcomes</button>
          <button class="chip" data-event-filter="signals" type="button">Captured Failure Signals</button>
        </div>
      </section>

      <section id="rel-toolbar" class="toolbar hidden">
        <div class="filters">
          <button class="chip active" data-rel-mode="all" type="button">Lineage + Shared Signals</button>
          <button class="chip" data-rel-mode="lineage" type="button">Explicit Lineage Only</button>
        </div>
      </section>

      <main id="content" class="content">
        <div id="list-pane" class="list-pane"></div>
        <aside id="detail-pane" class="detail-pane">
          <div class="empty">Select an Experience to inspect its signals, steps, and validation evidence.</div>
        </aside>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
